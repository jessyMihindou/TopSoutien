<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Admin - TopSoutien{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bleu-fonce: #0b0c37;
            --bleu-ciel: #eaf5fb;
            --orange: #e0753c;
            --gris-doux: #f4f7fb;
        }
        body {
            background: var(--bleu-ciel);
            margin: 0;
            font-family: 'Poppins', Arial, Helvetica, sans-serif;
        }
        .admin-navbar {
            background: var(--bleu-fonce);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 32px;
            height: 70px;
            box-shadow: none;
        }
        .admin-navbar .admin-logo {
            font-size: 1.7rem;
            font-weight: 800;
            color: #fff;
            margin-right: 40px;
            letter-spacing: 1px;
        }
        .admin-navbar nav {
            display: flex;
            gap: 18px;
        }
        .admin-navbar nav a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s;
        }
        .admin-navbar nav a.active, .admin-navbar nav a:hover {
            background: var(--orange);
            color: #fff;
        }
        .admin-navbar .admin-user {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .admin-navbar .admin-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bleu-fonce);
            font-size: 1.2rem;
            font-weight: 700;
        }
        @media (max-width: 900px) {
            .admin-navbar { flex-direction: column; height: auto; padding: 0 10px; }
            .admin-navbar nav { gap: 8px; }
            .admin-navbar .admin-logo { margin-bottom: 8px; }
        }
        main {
            max-width: 1400px;
            margin: 32px auto 0 auto;
            padding: 0 24px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="admin-navbar">
        <span class="admin-logo">TopSoutien Admin</span>

        <div class="admin-user">
            <span class="admin-avatar"><i class="fas fa-user-shield"></i></span>
            <span>Admin</span>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
</body>
</html>
