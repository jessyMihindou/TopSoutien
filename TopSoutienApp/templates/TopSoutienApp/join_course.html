{% extends 'TopSoutienApp/base.html' %}
{% load static %}

{% block title %}Salle de cours en visio - TopSoutien{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root {
    --orange: #e76c40;
    --jaune: #bf903a;
    --bleu-fonce: #0b0c37;
}
.visio-bg {
    background: #fff;
    min-height: 100vh;
    padding: 0;
}
.visio-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 0 0 0;
    display: flex;
    gap: 32px;
    min-height: 80vh;
}
.visio-main {
    flex: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff;
    border-radius: 18px;
    box-shadow: none !important;
    padding: 32px 0;
    min-height: 500px;
    position: relative;
}
#videoElement {
    width: 520px;
    height: 340px;
    background: #222;
    border-radius: 16px;
    object-fit: cover;
    box-shadow: 0 2px 12px rgba(0,0,0,0.10);
}
.visio-controls {
    display: flex;
    gap: 24px;
    margin-top: 24px;
    justify-content: center;
}
.visio-controls button {
    background: var(--orange);
    color: #fff;
    border: 2px solid #fff;
    font-size: 1.6rem;
    border-radius: 50%;
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: background 0.2s, color 0.2s;
}
.visio-controls button.active {
    background: var(--bleu-fonce);
    color: #fff;
    border-color: var(--bleu-fonce);
}
.visio-controls button.quit {
    background: var(--jaune);
    color: #fff;
    border: 2px solid var(--jaune);
}
.visio-controls button.quit:hover {
    background: var(--bleu-fonce);
    color: #fff;
}
.visio-participants {
    flex: 1;
    background: #fff;
    border-radius: 18px;
    box-shadow: none !important;
    padding: 32px 18px;
    min-width: 220px;
    max-width: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: fit-content;
}
.participant-list {
    width: 100%;
    margin-top: 12px;
}
.participant-item {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
}
.participant-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #e3e6f0;
}
.participant-status {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--orange);
    margin-right: 6px;
}
.participant-name {
    font-weight: 600;
    color: var(--bleu-fonce);
}
@media (max-width: 900px) {
    .visio-container {
        flex-direction: column;
        align-items: center;
        gap: 18px;
    }
    #videoElement {
        width: 100%;
        max-width: 98vw;
        height: 220px;
    }
    .visio-main, .visio-participants {
        width: 100%;
        min-width: unset;
        max-width: unset;
    }
}

/* Responsive Design */
@media (max-width: 768px) {
    .visio-container {
        gap: 16px;
        padding: 20px;
    }
    
    #videoElement {
        height: 200px;
    }
    
    .visio-controls {
        gap: 12px;
    }
    
    .visio-controls button {
        width: 50px;
        height: 50px;
        font-size: 1.1rem;
    }
    
    .visio-participants {
        padding: 16px;
    }
    
    .participant-item {
        padding: 12px;
        gap: 12px;
    }
    
    .participant-avatar {
        width: 40px;
        height: 40px;
    }
}

@media (max-width: 480px) {
    .visio-container {
        padding: 16px;
        gap: 12px;
    }
    
    #videoElement {
        height: 180px;
    }
    
    .visio-controls {
        gap: 8px;
    }
    
    .visio-controls button {
        width: 45px;
        height: 45px;
        font-size: 1rem;
    }
    
    .visio-participants {
        padding: 12px;
    }
    
    .visio-participants h5 {
        font-size: 1.1rem;
    }
    
    .participant-item {
        padding: 10px;
        gap: 10px;
    }
    
    .participant-avatar {
        width: 35px;
        height: 35px;
    }
    
    .participant-name {
        font-size: 0.9rem;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="visio-bg">
    <div class="visio-container">
        <div class="visio-main">
            <video id="videoElement" autoplay playsinline muted></video>
            <div class="visio-controls mt-3">
                <button id="toggleCamera" class="active" title="Activer/Désactiver la caméra"><i class="fas fa-video"></i></button>
                <button id="toggleMic" class="active" title="Activer/Désactiver le micro"><i class="fas fa-microphone"></i></button>
                <button id="quitBtn" class="quit" title="Quitter la salle"><i class="fas fa-phone-slash"></i></button>
            </div>
        </div>
        <div class="visio-participants">
            <h5 class="mb-3">Participants</h5>
            <div class="participant-list">
                <div class="participant-item">
                    <span class="participant-status"></span>
                    <img src="{% static 'TopSoutienApp/images/jessy.jpg' %}" class="participant-avatar" alt="Avatar">
                    <span class="participant-name">Moi (Vous)</span>
                </div>
                <div class="participant-item">
                    <span class="participant-status"></span>
                    <img src="{% static 'TopSoutienApp/images/img_1.png' %}" class="participant-avatar" alt="Avatar">
                    <span class="participant-name">Sophie Martin</span>
                </div>
                <div class="participant-item">
                    <span class="participant-status"></span>
                    <img src="{% static 'TopSoutienApp/images/img.png' %}" class="participant-avatar" alt="Avatar">
                    <span class="participant-name">John Smith</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let stream;
const video = document.getElementById('videoElement');
const cameraBtn = document.getElementById('toggleCamera');
const micBtn = document.getElementById('toggleMic');
const quitBtn = document.getElementById('quitBtn');
let cameraOn = true;
let micOn = true;

async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        video.srcObject = stream;
    } catch (err) {
        alert('Impossible d\'accéder à la caméra ou au micro.');
    }
}

function toggleCamera() {
    if (!stream) return;
    cameraOn = !cameraOn;
    stream.getVideoTracks().forEach(track => track.enabled = cameraOn);
    cameraBtn.classList.toggle('active', cameraOn);
    cameraBtn.innerHTML = cameraOn ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
}

function toggleMic() {
    if (!stream) return;
    micOn = !micOn;
    stream.getAudioTracks().forEach(track => track.enabled = micOn);
    micBtn.classList.toggle('active', micOn);
    micBtn.innerHTML = micOn ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
}

function quitRoom() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }
    window.location.href = '/profil-etudiant/'; // Redirige vers le profil étudiant (à adapter si besoin)
}

cameraBtn.addEventListener('click', toggleCamera);
micBtn.addEventListener('click', toggleMic);
quitBtn.addEventListener('click', quitRoom);

startCamera();
</script>
{% endblock %}
